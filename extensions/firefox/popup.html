<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Raglex Web Clipper</title>
  <style>
    :root { --bg:#111111; --surface:#18181B; --muted:#27272A; --ink:#FAFAFA; --sub:#A1A1AA; --accent:#FF5C33; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { width:340px; background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,sans-serif; padding:14px; }
    .hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
    .dot { width:9px; height:9px; border-radius:99px; background:var(--accent); }
    .status { font-size:11px; color:var(--sub); }
    .card { background:var(--surface); border-radius:14px; padding:12px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
    label { font-size:11px; color:var(--sub); }
    input, select { width:100%; background:var(--muted); color:var(--ink); border:none; border-radius:10px; padding:8px 10px; font-size:12px; outline:none; }
    .row { display:flex; gap:8px; }
    button { flex:1; border:none; border-radius:10px; padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer; background:var(--muted); color:var(--ink); }
    button.primary { background:var(--accent); color:#fff; }
    button:hover { filter:brightness(1.08); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-height:190px; overflow:auto; margin-top:4px; }
    .tile { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1/1; background:var(--muted); cursor:pointer; border:2px solid transparent; }
    .tile.sel { border-color:var(--accent); }
    .tile img { width:100%; height:100%; object-fit:cover; display:block; }
    #msg { font-size:11px; color:var(--sub); min-height:16px; }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="brand"><span class="dot"></span>Raglex Clipper</div>
    <span class="status" id="conn">Checking…</span>
  </div>

  <div class="card">
    <label>Raglex Built-in Server URL</label>
    <input id="url" placeholder="http://127.0.0.1:41595">
    <label>API Token (from Preferences → Sharing)</label>
    <input id="token" type="password" placeholder="Paste Raglex API token">
    <label>Default Tag (optional)</label>
    <select id="tag"><option value="">No default tag</option></select>
  </div>

  <div class="row" style="margin-bottom:10px">
    <button class="primary" id="capture">Capture Screenshot</button>
    <button id="scan">Scan Page Images</button>
  </div>

  <div class="card" id="batchCard" style="display:none">
    <div class="row" style="align-items:center">
      <span style="font-size:12px;font-weight:600" id="batchCount">0 images</span>
      <button class="primary" id="saveBatch" style="flex:0 0 auto;padding:6px 12px">Save Selected</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
