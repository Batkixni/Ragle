<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Raglex Clipper</title>
  <style>
    :root {
      --bg: #151518;
      --bg-hover: rgba(255, 255, 255, 0.055);
      --bg-active: rgba(255, 255, 255, 0.09);
      --input: rgba(255, 255, 255, 0.06);
      --hairline: rgba(255, 255, 255, 0.08);
      --ink: #FAFAFA;
      --ink-sub: #A1A1AA;
      --ink-muted: #71717A;
      --accent: #FF5C33;
      --accent-soft: rgba(255, 92, 51, 0.14);
      --ok: #10B981;
      --ok-soft: rgba(16, 185, 129, 0.14);
      --danger: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 356px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei UI", Inter, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--hairline);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: -0.01em;
    }
    .brand svg { width: 17px; height: 17px; flex-shrink: 0; }
    .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-sub);
      background: var(--input);
      border: none;
      cursor: pointer;
      transition: background 140ms ease;
    }
    .conn-pill:hover { background: var(--bg-active); }
    .conn-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--ink-muted);
    }
    .conn-pill.ok .conn-dot { background: var(--ok); }
    .conn-pill.ok { color: #D4D4D8; }
    .conn-pill.off .conn-dot { background: var(--danger); }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--ink-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--ink); }
    .icon-btn.active { background: var(--bg-active); color: var(--ink); }
    .icon-btn svg { width: 15px; height: 15px; }

    /* Offline prompt (only when disconnected) */
    .offline-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 14px;
      background: rgba(248, 113, 113, 0.08);
      border-bottom: 1px solid var(--hairline);
      font-size: 11.5px;
      color: #FCA5A5;
    }
    .offline-bar.show { display: flex; }
    .link-btn {
      border: none;
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .link-btn:hover { background: rgba(255,255,255,0.14); }

    /* Views */
    .view { padding: 8px; }
    .view.hidden { display: none; }

    /* Current page context line */
    .page-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 4px;
      border-radius: 8px;
      color: var(--ink-sub);
      font-size: 11.5px;
    }
    .page-strip img {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .page-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #D4D4D8;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--input);
      color: var(--ink-sub);
      flex-shrink: 0;
    }
    .badge.yt { background: var(--accent-soft); color: #FF7855; }
    .badge.feed { background: rgba(56, 189, 248, 0.14); color: #38BDF8; }

    /* Flat menu-style action rows (matching Raglex right-click menu & flat preferences) */
    .action-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 120ms ease;
    }
    .action-row:hover { background: var(--bg-hover); }
    .action-row:active { background: var(--bg-active); }
    .action-row:disabled { opacity: 0.45; cursor: default; }
    .action-row svg {
      width: 16px;
      height: 16px;
      color: var(--ink-sub);
      flex-shrink: 0;
    }
    .action-row.primary-row {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .action-row.primary-row svg { color: #FFFFFF; }
    .action-row.primary-row:hover { filter: brightness(1.07); }
    .action-row .meta {
      margin-left: auto;
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 400;
    }
    .action-row.primary-row .meta { color: rgba(255,255,255,0.82); }

    /* Crisp hairline dividers */
    .divider {
      height: 1px;
      background: var(--hairline);
      margin: 7px 8px;
    }
    .sec-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-muted);
      padding: 3px 10px 4px;
      letter-spacing: 0.02em;
    }

    /* Flat form rows (icon + <=8 char label + compact right control) */
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 120ms ease;
    }
    .field-row:hover { background: var(--bg-hover); }
    .field-row svg {
      width: 15px;
      height: 15px;
      color: var(--ink-sub);
      flex-shrink: 0;
    }
    .field-label {
      font-size: 12.5px;
      color: var(--ink);
      white-space: nowrap;
      min-width: 66px;
    }
    .field-ctrl {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--input);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 140ms ease, background 140ms ease;
    }
    select option { background: #1C1C20; color: var(--ink); }
    select:focus, input:focus {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.085);
    }

    /* Pill segmented control */
    .seg {
      display: inline-flex;
      background: var(--input);
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }
    .seg button {
      border: none;
      background: transparent;
      color: var(--ink-sub);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 5px;
      cursor: pointer;
    }
    .seg button.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--ink);
    }

    /* Minimal toggle switch */
    .switch {
      position: relative;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: background 160ms ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #FAFAFA;
      transition: transform 160ms cubic-bezier(.2,.8,.2,1);
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(14px); }

    /* Batch image grabber drawer */
    .batch-wrap {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 4px 6px 2px;
    }
    .batch-wrap.show { display: flex; }
    .batch-hdr {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
    }
    .batch-hdr .count {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-sub);
      flex: 1;
    }
    .mini-btn {
      border: none;
      background: var(--input);
      color: var(--ink-sub);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mini-btn:hover { background: var(--bg-active); color: var(--ink); }
    .mini-btn.accent { background: var(--accent); color: #fff; font-weight: 600; }
    .mini-btn.accent:hover { filter: brightness(1.08); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 204px;
      overflow-y: auto;
      padding: 2px 4px;
    }
    .grid::-webkit-scrollbar { width: 5px; }
    .grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 99px; }
    .tile {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: #202024;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 120ms ease, transform 120ms ease;
    }
    .tile.sel { border-color: var(--accent); }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .dim {
      position: absolute;
      left: 4px;
      bottom: 4px;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      color: #FAFAFA;
      background: rgba(0, 0, 0, 0.72);
    }
    .tile .chk {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1.5px solid rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: transparent;
    }
    .tile.sel .chk {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    /* Settings hint */
    .hint {
      font-size: 11px;
      color: var(--ink-muted);
      padding: 2px 10px 6px;
      line-height: 1.45;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 6px 10px 4px;
    }
    .btn-flat {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--input);
      color: var(--ink);
      transition: background 140ms ease;
    }
    .btn-flat:hover { background: var(--bg-active); }
    .btn-flat.primary { background: var(--accent); color: #fff; }

    /* Footer feedback bar */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--hairline);
      min-height: 33px;
      font-size: 11px;
      color: var(--ink-muted);
    }
    .footer-msg {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer-msg.ok { color: #34D399; }
    .footer-msg.err { color: var(--danger); }
    .footer-link {
      color: var(--ink-sub);
      text-decoration: none;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }
    .footer-link:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a9 9 0 0 0-9 9v7h5v-7a4 4 0 0 1 8 0v7h5v-7a9 9 0 0 0-9-9Z" fill="#FF5C33" stroke="none"/>
        <circle cx="12" cy="14" r="2.6" fill="#151518" stroke="none"/>
      </svg>
      <span>Raglex</span>
    </div>
    <div class="top-right">
      <button class="conn-pill" id="connPill" title="連線狀態">
        <span class="conn-dot"></span>
        <span id="connText">…</span>
      </button>
      <button class="icon-btn" id="settingsBtn" title="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="offline-bar" id="offlineBar">
    <span id="offlineText">尚未連線至 Raglex 桌面版</span>
    <div style="display:flex;gap:4px">
      <button class="link-btn" id="retryBtn">重試</button>
      <button class="link-btn" id="openCfgBtn">設定</button>
    </div>
  </div>

  <!-- MAIN CLIP VIEW -->
  <div class="view" id="mainView">
    <div class="page-strip">
      <img id="pageFav" alt="" style="display:none">
      <span class="page-title" id="pageTitle">…</span>
      <span class="badge" id="sourceBadge">網頁</span>
    </div>

    <button class="action-row primary-row" id="savePageBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      <span data-i18n="savePage">儲存此頁（書籤 / 來源）</span>
      <span class="meta" id="savePageMeta"></span>
    </button>

    <button class="action-row" id="captureBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span data-i18n="capture">擷取畫面截圖</span>
      <span class="meta">PNG</span>
    </button>

    <button class="action-row" id="scanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span data-i18n="scan">掃描本頁所有圖片</span>
      <span class="meta" id="scanMeta"></span>
    </button>

    <!-- Batch Image Grabber Drawer -->
    <div class="batch-wrap" id="batchWrap">
      <div class="divider" style="margin:3px 2px"></div>
      <div class="batch-hdr">
        <span class="count" id="batchCount">0</span>
        <button class="mini-btn" id="toggleAllBtn" data-i18n="selectAll">全選</button>
        <button class="mini-btn accent" id="saveBatchBtn" data-i18n="saveSelected">儲存選取</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="divider"></div>
    <div class="sec-label" data-i18n="destSection">歸類目標（選填）</div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l6.59-6.59a1 1 0 0 0 0-1.41Z"/>
        <circle cx="7.5" cy="7.5" r="1.2"/>
      </svg>
      <span class="field-label" data-i18n="tag">標籤</span>
      <div class="field-ctrl">
        <select id="tag"></select>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
      </svg>
      <span class="field-label" data-i18n="project">專案</span>
      <div class="field-ctrl">
        <select id="project"></select>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18"/>
        <path d="M9 21V9"/>
      </svg>
      <span class="field-label" data-i18n="board">白板</span>
      <div class="field-ctrl">
        <select id="board"></select>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
      <span class="field-label" data-i18n="note">備註</span>
      <div class="field-ctrl">
        <input id="note" type="text" placeholder="靈感、用途或出處備註…">
      </div>
    </div>
  </div>

  <!-- SETTINGS VIEW (tucked cleanly behind gear icon) -->
  <div class="view hidden" id="settingsView">
    <div class="sec-label" data-i18n="generalSec">偏好設定</div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span class="field-label" data-i18n="language">介面語言</span>
      <div class="field-ctrl">
        <div class="seg">
          <button id="langZh" type="button">繁中</button>
          <button id="langEn" type="button">EN</button>
        </div>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span class="field-label" data-i18n="dragCapsule">拖拉存圖膠囊</span>
      <div class="field-ctrl">
        <label class="switch"><input type="checkbox" id="dragEnabled"><span class="slider"></span></label>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
      </svg>
      <span class="field-label" data-i18n="autoStack">多圖自動堆疊</span>
      <div class="field-ctrl">
        <label class="switch"><input type="checkbox" id="autoStack"><span class="slider"></span></label>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l6.59-6.59a1 1 0 0 0 0-1.41Z"/>
        <circle cx="7.5" cy="7.5" r="1.2"/>
      </svg>
      <span class="field-label" data-i18n="autoTag">自動來源標籤</span>
      <div class="field-ctrl">
        <label class="switch"><input type="checkbox" id="autoTag"><span class="slider"></span></label>
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
      </svg>
      <span class="field-label" data-i18n="offlineDir">離線資料夾</span>
      <div class="field-ctrl">
        <input id="offlineFolder" type="text" placeholder="RaglexInbox">
      </div>
    </div>

    <div class="divider"></div>
    <div class="sec-label" data-i18n="connSec">進階連線設定</div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="field-label" data-i18n="localAddr">連線位址</span>
      <div class="field-ctrl">
        <input id="url" type="text" placeholder="http://127.0.0.1:47595">
      </div>
    </div>

    <div class="field-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span class="field-label" data-i18n="accessKey">存取金鑰</span>
      <div class="field-ctrl">
        <input id="token" type="password" placeholder="選填">
      </div>
    </div>

    <div class="hint" data-i18n="connHint">
      開啟 Raglex 偏好設定 → 瀏覽器擴充，開啟「擴充連線」並點擊「複製金鑰」貼上即可配對。
    </div>

    <div class="btn-row">
      <button class="btn-flat" id="backMainBtn" data-i18n="back">返回</button>
      <button class="btn-flat primary" id="testConnBtn" data-i18n="testConn">儲存並測試連線</button>
    </div>
  </div>

  <div class="footer">
    <span class="footer-msg" id="msg"></span>
    <a class="footer-link" id="openGallery" data-i18n="openWeb">開啟網頁圖庫 ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
